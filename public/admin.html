<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - BOITHOK KHANA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0e27;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 0, 0, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(220, 20, 60, 0.3) 0%, transparent 40%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        /* LOGIN CONTAINER */
        .login-wrapper {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes floatCard {
            0%, 100% {
                transform: translateY(0px);
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 215, 0, 0.25);
            }
            50% {
                transform: translateY(-12px);
                box-shadow: 0 25px 45px rgba(0, 0, 0, 0.65), 0 0 35px rgba(255, 215, 0, 0.45);
            }
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(10, 14, 39, 0.75);
            backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            animation: floatCard 5s ease-in-out infinite;
            text-align: center;
        }

        .login-card img {
            height: 70px;
            margin-bottom: 15px;
        }

        .login-title {
            color: #FFD700;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #FFD700;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: #fff;
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #8B0000;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        .error-msg {
            color: #ff6b6b;
            background: rgba(220, 20, 60, 0.2);
            border: 1px solid rgba(220, 20, 60, 0.4);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }

        /* DASHBOARD (Hidden by default) */
        #dashboardView {
            display: none;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-brand img {
            height: 45px;
        }

        .header-brand h1 {
            font-size: 20px;
            color: #FFD700;
        }

        .header-nav {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: rgba(255, 215, 0, 0.12);
            color: #FFD700;
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 215, 0, 0.25);
            color: #fff;
        }

        .btn-logout {
            background: rgba(220, 20, 60, 0.2);
            color: #ff6b6b;
            border-color: rgba(220, 20, 60, 0.4);
        }

        .btn-logout:hover {
            background: rgba(220, 20, 60, 0.6);
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-info h3 {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .stat-info .stat-number {
            font-size: 30px;
            font-weight: 900;
            color: #FFD700;
        }

        .stat-icon {
            font-size: 36px;
        }

        .table-card {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            padding: 25px;
        }

        /* Filter controls */
        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 700;
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-select {
            padding: 10px 14px;
            background: rgba(10, 14, 39, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .filter-select:focus {
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            opacity: 0.7;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-export {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #8B0000;
        }

        .btn-refresh {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(139, 0, 0, 0.4);
            color: #FFD700;
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.4);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 14px;
            color: #eee;
        }

        .badge-id {
            background: rgba(255, 215, 0, 0.15);
            color: #FFD700;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
        }

        .btn-delete {
            background: rgba(220, 20, 60, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(220, 20, 60, 0.4);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-delete:hover {
            background: rgba(220, 20, 60, 0.6);
            color: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #aaa;
            font-style: italic;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(76, 175, 80, 0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <!-- 🔐 LOGIN VIEW -->
    <div id="loginView" class="login-wrapper">
        <div class="login-card">
            <img src="https://github.com/workarijit06/BoithokKhana_social/blob/main/logo.png?raw=true" alt="Logo">
            <h2 class="login-title">🔐 Admin Login</h2>
            <form onsubmit="handleLoginSubmit(event)">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter admin username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter admin password" required>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">Login to Dashboard</button>
            </form>
            <div id="loginError" class="error-msg">Invalid username or password</div>
        </div>
    </div>

    <!-- 📊 DASHBOARD VIEW -->
    <div id="dashboardView">
        <header>
            <div class="header-brand">
                <img src="https://github.com/workarijit06/BoithokKhana_social/blob/main/logo.png?raw=true" alt="Logo">
                <h1>Customer Admin Dashboard</h1>
            </div>
            <div class="header-nav">
                <a href="index.html" target="_blank" class="nav-btn">📝 Main Website</a>
                <a href="customer-entry.html" target="_blank" class="nav-btn">📋 Data Entry Form</a>
                <button class="nav-btn btn-logout" onclick="handleLogout()">🔒 Logout</button>
            </div>
        </header>

        <div class="container">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Total Customers</h3>
                        <div class="stat-number" id="totalCustomers">0</div>
                    </div>
                    <div class="stat-icon">👥</div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Registered Today</h3>
                        <div class="stat-number" id="todayRegistrations">0</div>
                    </div>
                    <div class="stat-icon">📅</div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Birthdays This Month</h3>
                        <div class="stat-number" id="monthBirthdays">0</div>
                    </div>
                    <div class="stat-icon">🎂</div>
                </div>
            </div>

            <!-- Month & Birthdate Filtering Section -->
            <div class="table-card">
                <div class="filter-section">
                    <div class="filter-group">
                        <label for="filterRegMonth">🗓️ Filter by Registration Month</label>
                        <select id="filterRegMonth" class="filter-select" onchange="filterCustomers()">
                            <option value="ALL">All Registration Months</option>
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="filterBirthMonth">🎂 Filter by Birth Month</label>
                        <select id="filterBirthMonth" class="filter-select" onchange="filterCustomers()">
                            <option value="ALL">All Birth Months (e.g. August, April...)</option>
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>
                </div>

                <div class="controls-bar">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search by customer name, phone, or ID..." onkeyup="filterCustomers()">
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-refresh" onclick="loadDashboardData()">🔄 Refresh</button>
                        <button class="btn btn-export" onclick="exportCSV()">📥 Export CSV</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Customer ID</th>
                                <th>Name</th>
                                <th>Birth Date</th>
                                <th>Phone Number</th>
                                <th>Registration Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody">
                            <tr>
                                <td colspan="6" class="empty-state">Loading customer records...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Action completed</div>

    <script>
        let allCustomers = [];
        let authToken = sessionStorage.getItem('admin_token') || '';

        document.addEventListener('DOMContentLoaded', () => {
            if (authToken) {
                showDashboard();
            } else {
                showLogin();
            }
        });

        async function handleLoginSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerText = 'Authenticating...';
            err.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    authToken = data.token;
                    sessionStorage.setItem('admin_token', authToken);
                    showDashboard();
                } else {
                    err.innerText = data.message || 'Invalid username or password';
                    err.style.display = 'block';
                }
            } catch (error) {
                if (window.location.protocol === 'file:') {
                    err.innerHTML = '⚠️ File opened directly via file://<br>Please open <strong><a href="http://localhost:3000/admin" style="color:#FFD700;">http://localhost:3000/admin</a></strong> in your browser.';
                } else {
                    err.innerText = 'Network error connecting to backend server. Make sure node server.js is running.';
                }
                err.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Login to Dashboard';
            }
        }

        function showLogin() {
            document.getElementById('loginView').style.display = 'flex';
            document.getElementById('dashboardView').style.display = 'none';
        }

        function showDashboard() {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            loadDashboardData();
        }

        function handleLogout() {
            authToken = '';
            sessionStorage.removeItem('admin_token');
            showLogin();
        }

        async function loadDashboardData() {
            try {
                const response = await fetch('/api/customers', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (response.status === 401) {
                    handleLogout();
                    return;
                }

                const result = await response.json();
                if (result.success) {
                    allCustomers = result.data || [];
                    console.log('Loaded Customers:', allCustomers);
                }

                const statsRes = await fetch('/api/stats', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (statsRes.ok) {
                    const statsData = await statsRes.json();
                    document.getElementById('totalCustomers').innerText = statsData.stats.totalCustomers || 0;
                    document.getElementById('todayRegistrations').innerText = statsData.stats.todayRegistrations || 0;
                    document.getElementById('monthBirthdays').innerText = statsData.stats.birthdaysThisMonth || 0;
                }

                filterCustomers();
            } catch (err) {
                console.error('Error loading dashboard data:', err);
            }
        }

        function renderTable(customers) {
            const tbody = document.getElementById('customerTableBody');
            if (!customers || customers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No matching customer records found.</td></tr>';
                return;
            }

            tbody.innerHTML = customers.map(c => {
                const dob = c.dob || c.birth_date || 'N/A';
                const regDate = c.registeredAt || c.registration_date;
                const formattedRegDate = regDate ? new Date(regDate).toLocaleString('en-IN') : 'N/A';

                return `
                <tr>
                    <td><span class="badge-id">${escapeHtml(c.id || 'N/A')}</span></td>
                    <td><strong>${escapeHtml(c.name || '')}</strong></td>
                    <td>📅 ${escapeHtml(dob)}</td>
                    <td>📞 ${escapeHtml(c.phone || '')}</td>
                    <td>${formattedRegDate}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteCustomer('${c.id}')">🗑️ Delete</button>
                    </td>
                </tr>
                `;
            }).join('');
        }

        function filterCustomers() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const regMonth = document.getElementById('filterRegMonth').value;
            const birthMonth = document.getElementById('filterBirthMonth').value;

            let filtered = allCustomers;

            // Search filter
            if (query) {
                filtered = filtered.filter(c => 
                    (c.name && c.name.toLowerCase().includes(query)) ||
                    (c.phone && c.phone.toLowerCase().includes(query)) ||
                    (c.id && String(c.id).toLowerCase().includes(query))
                );
            }

            // Registration Month filter
            if (regMonth !== 'ALL') {
                const targetMonth = parseInt(regMonth, 10);
                filtered = filtered.filter(c => {
                    const regDate = c.registeredAt || c.registration_date;
                    if (!regDate) return false;
                    const date = new Date(regDate);
                    return (date.getMonth() + 1) === targetMonth;
                });
            }

            // Birthdate Month filter (e.g. August = 8, April = 4)
            if (birthMonth !== 'ALL') {
                const targetMonth = parseInt(birthMonth, 10);
                filtered = filtered.filter(c => {
                    const dob = c.dob || c.birth_date;
                    if (!dob) return false;
                    const parts = String(dob).split('-');
                    if (parts.length >= 2) {
                        return parseInt(parts[1], 10) === targetMonth;
                    }
                    return false;
                });
            }

            renderTable(filtered);
        }

        async function deleteCustomer(id) {
            if (!confirm('Are you sure you want to delete this customer record?')) return;

            try {
                const res = await fetch('/api/delete-customer/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (res.ok) {
                    showToast('Customer record deleted.');
                    loadDashboardData();
                } else if (res.status === 401) {
                    handleLogout();
                }
            } catch (err) {
                showToast('Failed to delete customer record.');
            }
        }

        function exportCSV() {
            fetch('/api/export', {
                headers: { 'Authorization': `Bearer ${authToken}` }
            })
            .then(res => {
                if (res.status === 401) { handleLogout(); return; }
                return res.blob();
            })
            .then(blob => {
                if (!blob) return;
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "boithok_khana_customers.csv";
                document.body.appendChild(a);
                a.click();
                a.remove();
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
